// 余音 Reverb — root build file
// 2026-11-14:compileSdk / targetSdk 升到 37(Android 17)。API 37 的平台包按小版本发布
// (`platforms;android-37.0`),AGP 8.5.2 的查找口径只认 `platforms;android-37`,找不到
// ⇒ 一并升到 AGP 9.x。AGP 9 起 Kotlin 走内置支持,不再 apply `org.jetbrains.kotlin.android`。
plugins {
    id 'com.android.application' version '9.5.1' apply false
    // AGP 9 的内置 Kotlin(2.2.10)要求 Compose 也走 Kotlin 的 Compose 编译器插件,
    // 版本必须与内置 Kotlin 对齐 —— 取的是 AGP 9.5.1 实际解析出来的 2.2.10。
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
}
