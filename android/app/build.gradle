plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.yuyin.reverb'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuyin.reverb.android"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    // 渠道维度。1.0.1 起 Android 两个渠道统一用 com.yuyin.reverb.android,
    // com.yuyin.reverb 留给鸿蒙端(分发平台包名创建后不可改,由来见 docs/BEIAN.md):
    //   com.yuyin.reverb.android  全部 Android 分发 —— 官网 / GitHub 自分发 + 大陆商店
    //   com.yuyin.reverb          HarmonyOS 专属
    // 统一是产品决策(用户与品牌视角只有一个 Android 应用)。官网在 1.0.1 前未发布,
    // 1.0.0 时代「默认渠道 = com.yuyin.reverb」的包只在开发期存在,没有用户需要迁移。
    // 注意:两渠道功能仍不同(离线转写/真实频谱只在默认渠道,见 H70),同包名意味着
    // 同设备上商店删减版可以覆盖官网完整版 —— 装哪个由下载渠道决定,不再由包名隔离。
    // namespace 仍是 com.yuyin.reverb(R 类与 manifest 包名无需变),
    // FileProvider 用的是 ${applicationId}.fileprovider 占位符,会自动跟随。
    flavorDimensions "channel"
    productFlavors {
        // 默认渠道:官网 / GitHub 自分发,功能完整。
        'default' {
            dimension "channel"
            // 离线语音识别只随这个渠道分发,只出 arm64 —— armeabi-v7a 的机器跑不动这个模型,
            // 给了也是让人干等。**abiFilters 必须写在 flavor 里**:写在 defaultConfig 会
            // 让商店渠道也带上 native 目录结构。
            ndk { abiFilters 'arm64-v8a' }
            // 真实频谱(Visualizer 读播放输出做 FFT,需 RECORD_AUDIO)。
            // 权限声明放在 src/default/AndroidManifest.xml,商店渠道那份 manifest 里没有。
            buildConfigField "boolean", "SPECTRUM", "true"
            // 内容目录(分类热门榜 / 电台推荐 / 内置精选清单)。默认渠道保留完整功能。
            buildConfigField "boolean", "CATALOG", "true"
        }
        // 大陆商店渠道:各家应用市场 共用。与默认渠道同包名、不同功能(见上),
        // APK 仍是两份 —— 功能差异由各自的 source set 与开关决定。
        store {
            dimension "channel"
            // 应用市场把 RECORD_AUDIO 列为敏感隐私权限,需逐次举证并提供场景截图。
            // 该权限在本应用只服务于「真实频谱」这一个视觉效果(默认关闭),
            // 收益与举证成本不成比例,故商店渠道**整块去掉**:
            // 既不声明权限(见 src/default 与 src/store 各自的 manifest),
            // 也不显示设置项(下面这个开关为 false,设置页与播放页都按它门控)。
            // 播放页统一走程序化水墨动效 —— 与鸿蒙端一致。
            buildConfigField "boolean", "SPECTRUM", "false"
            // 大陆商店渠道先按**完整内容目录**提交平台复核:分类热门榜、随机/情境电台、
            // 关键词搜索都恢复。此前曾按合规口径关掉 —— 「内置内容目录 / 分类浏览 /
            // 内容推荐」可能被判为提供视听节目服务,需个人主体拿不到的许可证。
            // 只剩官网 15 条推荐订阅 + 手填 RSS 的版本对普通用户基本不可用,所以首版先提交复核,
            // 若确实被拒再把这一行改回 false(见 H70)。种子清单仍不进本渠道 assets,
            // 冷启动内容池只靠在线榜单;离线转写与真实频谱也仍由各自 source set/开关移除。
            buildConfigField "boolean", "CATALOG", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "Reverb(余音).apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
        // 识别模型必须**不压缩**:压了就没法用 openFd 拿到长度、也没法直接读,
        // 而且 ggml 模型本身几乎压不动,压缩只换来每次读取的解压开销(见 WhisperEngine)。
        jniLibs {
            useLegacyPackaging false
        }
    }
    androidResources {
        noCompress 'bin'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
