<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cxyxl</title>
<meta name="description" content="个人应用与作品。">
<style>
:root{
  --bg:#F6F2E9; --surface:#FCFAF4; --fg:#22201C; --sub:#6B6459;
  --line:#DFD8C8; --accent:#3E8E7E; --gold:#B9913C;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0E1416; --surface:#161D20; --fg:#E7ECEA; --sub:#9BA6A3;
         --line:#2A3538; --accent:#7FD1C0; --gold:#E9C879; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:72px 22px 60px}
a{color:var(--accent)}
h1{font-size:30px;line-height:1.3;margin:0 0 6px}
.tag{color:var(--sub);font-size:15px;margin:0 0 44px}
.rule{width:40px;height:3px;background:var(--gold);border-radius:2px;margin:0 0 40px}
h2{font-size:15px;color:var(--sub);font-weight:600;letter-spacing:.04em;margin:0 0 14px}
.card{display:block;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:22px 24px;text-decoration:none;color:inherit;
  transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h3{margin:0 0 4px;font-size:19px}
.card p{margin:0;color:var(--sub);font-size:14.5px}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:26px;
  color:var(--sub);font-size:14px;text-align:center}
footer a{margin:0 8px}
</style>
</head>
<body>
<div class="wrap">

  <h1>cxyxl</h1>
  <p class="tag">个人开发的应用与作品。</p>
  <div class="rule"></div>

  <h2>应用</h2>

  <a class="card" href="/reverb/">
    <h3>余音 Reverb</h3>
    <p>播客客户端 · Android / macOS / HarmonyOS · 纯客户端，无后端、无账号、无广告</p>
  </a>

  <footer>
    <p>
      <a href="/reverb/">余音 Reverb</a>·
      <a href="/reverb/privacy.html">隐私政策</a>·
      <a href="mailto:ailurus@foxmail.com">ailurus@foxmail.com</a>
    </p>

    <!-- 网站备案号。与 App 关于页的 APP备案号(…号-1A)是**两套序列**,别互相沿用 ——
         这次实际下发的是 -2,而不是当初预写的 -1。
         监管要求登记网站底部展示备案号并链到 beian.miit.gov.cn;登记平台复核审的就是这个首页。 -->
    <p>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"
         style="color:var(--sub);text-decoration:none">浙ICP备2026068045号-2</a>
    </p>
  </footer>

</div>
</body>
</html>
